<!doctype html>
<html lang="id">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Harbor Project Control Dashboard</title>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<style>
:root{--navy:#0D1B3E;--cyan:#00C2D4;--green:#28A745;--red:#DC3545;--yellow:#FFC107;--bg:#F3F5F8;--line:#DCE2EA;--text:#182338;--muted:#687386}
*{box-sizing:border-box}body{margin:0;background:var(--bg);font-family:Inter,Segoe UI,Arial,sans-serif;color:var(--text);font-size:13px}
button,input{font:inherit}.top{background:var(--navy);color:#fff;padding:17px 28px;display:flex;justify-content:space-between}.brand{font-size:20px;font-weight:800}.sub{font-size:11px;color:#b9c4d8;margin-top:3px}
.toolbar{background:#fff;border-bottom:1px solid var(--line);padding:9px 28px;display:flex;gap:8px;justify-content:space-between;flex-wrap:wrap}.tabs{display:flex;gap:5px;overflow:auto}.tab,.btn{border:1px solid var(--line);background:#fff;border-radius:6px;padding:8px 12px;cursor:pointer;font-weight:700;font-size:11px}.active,.primary{background:var(--navy);color:#fff}.cyan{background:var(--cyan);color:#052a31;border-color:var(--cyan)}
.wrap{max-width:1450px;margin:auto;padding:18px 28px}.card{background:#fff;border:1px solid var(--line);border-radius:8px;padding:14px;margin-bottom:12px}.kpis{display:grid;grid-template-columns:repeat(6,1fr);gap:8px}.kpi{border:1px solid var(--line);border-radius:7px;padding:11px;background:#fff}.kpi label{display:block;font-size:9px;color:var(--muted);font-weight:800}.kpi strong{display:block;font-size:21px;color:var(--navy);margin-top:5px}.grid{display:grid;grid-template-columns:repeat(3,1fr);gap:8px}.field label{display:block;font-size:9px;text-transform:uppercase;color:var(--muted);font-weight:800;margin-bottom:4px}.field input{width:100%;border:1px solid #D6DDE7;border-radius:5px;padding:8px}
table{width:100%;border-collapse:collapse;background:#fff}th{background:#EFF3F7;color:#536075;font-size:10px;text-transform:uppercase;padding:8px;text-align:left}td{border-top:1px solid #EDF0F4;padding:6px;font-size:11px}td input{width:100%;border:1px solid #DDE3EB;border-radius:4px;padding:5px;font-size:11px}
.pill{border:1px solid currentColor;border-radius:12px;padding:2px 8px;font-weight:800;font-size:10px}.good{color:var(--green)}.bad{color:var(--red)}.warn{color:#B57B00}
.gate{position:fixed;inset:0;background:var(--bg);display:grid;place-items:center;z-index:20}.gate .card{width:min(430px,92vw);text-align:center}.small{font-size:10px;color:var(--muted)}
@media(max-width:900px){.kpis{grid-template-columns:repeat(3,1fr)}.grid{grid-template-columns:1fr}}
</style>
</head>
<body>
<header class="top"><div><div class="brand">⚓ Harbor Project Control Dashboard</div><div class="sub">Private • Multi-user • Planned / Actual / Deviation otomatis</div></div><div id="who"></div></header>
<div id="gate" class="gate"></div>
<div id="main" hidden>
<div class="toolbar"><div id="tabs"></div><div><button class="btn" onclick="signOut()">Keluar</button><button id="adminBtn" class="btn primary" hidden onclick="adminPanel()">Access Requests</button></div></div>
<main class="wrap" id="app"></main></div>
<script>
/* ====== SUPABASE CONFIG ======
   1. Create a Supabase project.
   2. Run supabase-schema.sql in SQL Editor.
   3. Paste your Project URL + anon key below.
*/
const SUPABASE_URL="https://nsddlqgbmxajpgvrgyvp.supabase.co";
const SUPABASE_ANON_KEY="sb_publishable_kKnQ35JDavh6n457D1RpmQ_HMec9Lsc";
const sb=supabase.createClient(SUPABASE_URL,SUPABASE_ANON_KEY);

const TH={ok:-3,risk:-8,rok:-10,rrisk:-25};
let projects=[],current="summary",profile=null;

const esc=s=>String(s??"").replaceAll("&","&amp;").replaceAll("<","&lt;").replaceAll('"',"&quot;");
const status=d=>d>=TH.ok?"On Track":d>=TH.risk?"At Risk":"Delayed";
const rel=(p,a)=>{if(!p)return"On Track";let d=(a-p)/p*100;return d>=TH.rok?"On Track":d>=TH.rrisk?"At Risk":"Delayed"};
const pill=s=>`<span class="pill ${s==="Delayed"?"bad":s==="At Risk"?"warn":"good"}">${s}</span>`;
const deviation=(p,a)=>+(Number(a)-Number(p)).toFixed(1);

async function boot(){
 if(SUPABASE_URL.startsWith("PASTE_")){gate("Konfigurasi belum dipasang","Buka <b>index.html</b> dan isi SUPABASE_URL serta SUPABASE_ANON_KEY dari project Supabase Anda.");return}
 const {data:{session}}=await sb.auth.getSession();
 if(!session){login();return}
 await loadProfile(session.user);
}
async function loadProfile(user){
 const {data,error}=await sb.from("profiles").select("*").eq("id",user.id).single();
 if(error){gate("Profil belum tersedia","Coba login ulang setelah menjalankan <b>supabase-schema.sql</b>.");return}
 profile=data; document.getElementById("who").textContent=data.email;
 if(data.role==="pending"){requestPage();return}
 if(data.role==="rejected"){gate("Akses ditolak","Hubungi pemilik dashboard untuk meminta akses.");return}
 document.getElementById("gate").style.display="none";document.getElementById("main").hidden=false;
 document.getElementById("adminBtn").hidden=data.role!=="owner";
 await loadData();render();
}
function gate(title,msg){document.getElementById("gate").innerHTML=`<div class="card"><div style="font-size:38px">🔒</div><h2>${title}</h2><p class="small">${msg}</p></div>`}
function login(){document.getElementById("gate").innerHTML=`<div class="card"><div style="font-size:38px">⚓</div><h2>Private Dashboard</h2><p class="small">Masukkan email untuk menerima magic link login.</p><input id="email" type="email" placeholder="nama@email.com" style="width:100%;padding:10px;border:1px solid #D6DDE7;border-radius:5px"><br><br><button class="btn primary" onclick="sendLogin()">Kirim Login Link</button><p id="loginMsg" class="small"></p></div>`}
async function sendLogin(){
  const email=document.getElementById("email").value.trim();
  if(!email)return;

  const {error}=await sb.auth.signInWithOtp({
    email,
    options:{
      emailRedirectTo:window.location.origin + "/index.html"
    }
  });

  document.getElementById("loginMsg").textContent=
    error ? error.message : "Link login sudah dikirim ke email Anda.";
}
function requestPage(){document.getElementById("gate").innerHTML=`<div class="card"><div style="font-size:38px">⏳</div><h2>Akses Menunggu Persetujuan</h2><p class="small">Email <b>${esc(profile.email)}</b> sudah terdaftar, tetapi belum di-approve.</p><button class="btn" onclick="sendRequest()">Request Access</button> <button class="btn" onclick="signOut()">Keluar</button><p id="rqmsg" class="small"></p></div>`}
async function sendRequest(){const {error}=await sb.from("access_requests").insert({user_id:profile.id});document.getElementById("rqmsg").textContent=error?(error.code==="23505"?"Request sudah pernah dikirim.":error.message):"Request terkirim. Tunggu approval owner."}
async function signOut(){await sb.auth.signOut();location.reload()}
async function loadData(){const {data,error}=await sb.from("projects").select("*").order("id");if(error){alert(error.message);return}projects=data||[]}
function tabs(){document.getElementById("tabs").innerHTML=projects.map(p=>`<button class="tab ${current===p.id?"active":""}" onclick="current=${p.id};render()">Project ${p.id}</button>`).join("")+`<button class="tab ${current==="summary"?"active":""}" onclick="current='summary';render()">Summary</button>`}
function input(label,key,p){return `<div class="field"><label>${label}</label><input value="${esc(p[key]||"")}" ${profile.role==="viewer"?'disabled':''} onchange="updateProject(${p.id},'${key}',this.value)"></div>`}
async function updateProject(id,key,val){if(profile.role==="viewer")return;let p=projects.find(x=>x.id===id);p[key]=["planned","actual"].includes(key)?Math.max(0,Math.min(100,Number(val)||0)):val;await sb.from("projects").update({[key]:p[key],updated_at:new Date().toISOString()}).eq("id",id);render()}
function kpi(l,v,c=""){return `<div class="kpi"><label>${l}</label><strong class="${c}">${esc(v)}</strong></div>`}
function projectView(p){let d=deviation(p.planned,p.actual),s=status(d);return `<div class="card"><h2>Project ${p.id}</h2><div class="grid">${input("Nama Project","name",p)}${input("Lokasi","location",p)}${input("PIC","pic",p)}${input("Project Manager","pm",p)}${input("Kontraktor","contractor",p)}${input("Tanggal Mulai","start_date",p)}${input("Target Completion","target_date",p)}</div></div>
<div class="kpis">${kpi("Planned",p.planned+"%")}${kpi("Actual",p.actual+"%")}${kpi("Deviation",(d>0?"+":"")+d+"%",d<0?"bad":"good")}${kpi("Remaining",(100-p.actual)+"%")}${kpi("Status",s,s==="Delayed"?"bad":s==="At Risk"?"warn":"good")}</div>
<div class="card"><h3>Progress Input</h3><div class="grid">${input("Planned (%)","planned",p)}${input("Actual (%)","actual",p)}<div><label class="small">Deviation & Status</label><div style="padding-top:9px">${pill(s)} <b>${d>0?"+":""}${d}%</b></div></div></div><p class="small">Deviation dihitung otomatis: Actual − Planned. Status tidak perlu diinput manual.</p></div>
<div class="card"><h3>Data Sync</h3><p class="small">Perubahan disimpan ke database dan akan terlihat oleh user lain yang sudah mendapat akses.</p></div>`}
function summary(){let avgP=projects.reduce((a,p)=>a+Number(p.planned),0)/(projects.length||1),avgA=projects.reduce((a,p)=>a+Number(p.actual),0)/(projects.length||1);return `<div class="card"><h2>Executive Summary — ${projects.length} Projects</h2><div class="kpis">${kpi("Avg Planned",avgP.toFixed(1)+"%")}${kpi("Avg Actual",avgA.toFixed(1)+"%")}${kpi("Overall Deviation",(avgA-avgP).toFixed(1)+"%",avgA<avgP?"bad":"good")}${kpi("On Track",projects.filter(p=>status(deviation(p.planned,p.actual))==="On Track").length,"good")}${kpi("At Risk",projects.filter(p=>status(deviation(p.planned,p.actual))==="At Risk").length,"warn")}${kpi("Delayed",projects.filter(p=>status(deviation(p.planned,p.actual))==="Delayed").length,"bad")}</div></div>
<div class="card"><table><thead><tr><th>No</th><th>Project</th><th>Planned</th><th>Actual</th><th>Deviation</th><th>Status</th><th>PIC</th></tr></thead><tbody>${projects.map(p=>{let d=deviation(p.planned,p.actual);return `<tr><td>${p.id}</td><td>${esc(p.name)}</td><td>${p.planned}%</td><td>${p.actual}%</td><td class="${d<0?'bad':'good'}">${d>0?'+':''}${d}%</td><td>${pill(status(d))}</td><td>${esc(p.pic)}</td></tr>`}).join("")}</tbody></table></div>`}
async function adminPanel(){if(profile.role!=="owner")return;const {data:req}=await sb.from("access_requests").select("*,profiles(email,full_name,role)").order("requested_at",{ascending:false});document.getElementById("gate").style.display="grid";document.getElementById("gate").innerHTML=`<div class="card" style="width:min(650px,94vw)"><h2>Access Requests</h2>${(req||[]).map(r=>`<div style="display:flex;justify-content:space-between;gap:8px;padding:10px 0;border-bottom:1px solid #eee"><span><b>${esc(r.profiles?.email)}</b><br><small>${r.status}</small></span>${r.status==="pending"?`<span><button class="btn cyan" onclick="approve('${r.id}','${r.user_id}')">Approve</button> <button class="btn" onclick="reject('${r.id}','${r.user_id}')">Reject</button></span>`:""}</div>`).join("")}<br><button class="btn primary" onclick="document.getElementById('gate').style.display='none'">Tutup</button></div>`}
async function approve(rid,uid){await sb.from("profiles").update({role:"viewer"}).eq("id",uid);await sb.from("access_requests").update({status:"approved",decided_at:new Date().toISOString()}).eq("id",rid);adminPanel()}
async function reject(rid,uid){await sb.from("profiles").update({role:"rejected"}).eq("id",uid);await sb.from("access_requests").update({status:"rejected",decided_at:new Date().toISOString()}).eq("id",rid);adminPanel()}
function render(){tabs();document.getElementById("app").innerHTML=current==="summary"?summary():projectView(projects.find(p=>p.id===current))}
sb.auth.onAuthStateChange((_e,s)=>{if(s)loadProfile(s.user)});boot();
</script>
</body></html>
